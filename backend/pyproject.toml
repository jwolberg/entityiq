[project]
name = "entityiq-backend"
version = "0.1.0"
description = "EntityIQ — Enterprise Business Verification & Risk Intelligence Platform (backend)"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]>=0.29.0",
    "starlette==0.37.2",
    "pydantic==2.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.27.2",
    "ruff==0.4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
